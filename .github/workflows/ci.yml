name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: core has no third-party requirements
        run: ./.github/scripts/check-core-deps.sh
      - name: fiber stays out of the core, gin and plugin graphs
        run: ./.github/scripts/check-no-fiber.sh . ginprblm mappers/gormmap
      - name: test-only drivers stay out of plugin code
        run: ./.github/scripts/check-test-only-deps.sh mappers/gormmap gorm.io/driver/sqlite github.com/mattn/go-sqlite3

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., ginprblm, fiberprblm, internal/paritytest, mappers/gormmap]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: go.mod is tidy
        run: GOWORK=off go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: vet (other platforms)
        # Platform-specific code (syscall errors) must build everywhere.
        if: matrix.module == '.'
        run: |
          for target in windows/amd64 darwin/arm64 js/wasm wasip1/wasm plan9/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done
      - name: test (workspace, race)
        run: go test -race ./...
      - name: test (module only)
        run: GOWORK=off go test ./...

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., ginprblm, fiberprblm, internal/paritytest, mappers/gormmap]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
